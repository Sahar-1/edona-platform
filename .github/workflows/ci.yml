# Nom affiché dans l'onglet Actions sur GitHub
name: EDONA Backend CI Pipeline

# Déclencheurs : s'exécute à chaque push ou PR sur la branche main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    # Machine virtuelle Ubuntu Linux temporaire
    runs-on: ubuntu-latest

    steps:
      # Étape 1 : Récupère le code source du dépôt
      - name: 1. Récupérer le code source
        uses: actions/checkout@v4

      # Étape 2 : Installe l'environnement Python 3.11
      - name: 2. Configurer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Étape 3 : Installe pip et les dépendances du projet
      - name: 3. Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Étape 4 : Compile main.py pour détecter les erreurs de syntaxe
      - name: 4. Vérifier la syntaxe du code (Linting)
        run: |
          python -m py_compile main.py

      # Étape 5 : Analyse de sécurité Bandit (ignore B101/assert et exclut cli.py et les tests)
      - name: 5. Analyse de sécurité (Bandit)
        run: |
          bandit -r . -x ./cli.py,./test_main.py -s B101 || exit 1

      # Étape 6 : Exécute la suite de tests unitaires avec pytest
      - name: 6. Exécuter les tests unitaires (pytest)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATABASE_URL: sqlite:///./test.db
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_S3_BUCKET: edona-item-images-bucket
        run: |
          pytest

  # 1. Étape de Build avec un nom d'image précis
      - name: Build Docker image
        run: |
          docker build --no-cache -t my-app:latest .

      # 2. Étape Trivy configurée pour lire le démon Docker local
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"
        with:
          image-ref: 'my-app:latest'
          docker-host: 'unix:///var/run/docker.sock' # <-- AJOUTER CETTE LIGNE (Permet à Trivy d'accéder au Docker local)
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      # Étape 9 : Lance le conteneur avec variables d'environnement et valide /health
      - name: 9. Tester le lancement du conteneur
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATABASE_URL: sqlite:///./test.db
          AWS_ENDPOINT_URL: http://localhost:4566
        run: |
          docker run -d -p 8000:8000 --name test-container \
            -e OPENAI_API_KEY=$OPENAI_API_KEY \
            -e DATABASE_URL=$DATABASE_URL \
            -e AWS_ENDPOINT_URL=$AWS_ENDPOINT_URL \
            edona-backend:test
          sleep 5
          curl --fail http://localhost:8000/health || exit 1