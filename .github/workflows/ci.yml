name: EDONA Backend CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Récupérer le code source
        uses: actions/checkout@v4

      - name: 2. Configurer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Vérifier la syntaxe du code (Linting)
        run: |
          python -m py_compile main.py

      - name: 5. Analyse de sécurité (Bandit)
        run: |
          bandit -r . -x ./cli.py,./test_main.py -s B101 || exit 1

      # Crée un réseau Docker partagé
      - name: 6. Créer le réseau Docker et démarrer LocalStack
        run: |
          docker network create ci-network
          docker run -d -p 4566:4566 --network ci-network --name localstack localstack/localstack:latest
          
          # Attendre que le port LocalStack soit réellement ouvert et à l'écoute
          timeout 30 bash -c 'until echo > /dev/tcp/localhost/4566; do sleep 1; done'

      - name: 7. Exécuter les tests unitaires (pytest)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATABASE_URL: sqlite:///./test.db
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_S3_BUCKET: edona-item-images-bucket
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
        run: |
          pytest

      - name: 8. Build Docker image
        run: |
          docker build --no-cache -t edona-backend:test .

      - name: 9. Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        env:
          TRIVY_DISABLE_VEX_NOTICE: "true"
        with:
          scan-type: 'image'
          image-ref: 'edona-backend:test'
          docker-host: 'unix:///var/run/docker.sock'
          trivyignores: '.trivyignore'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      # Exécute le conteneur dans le réseau partagé 'ci-network' avec le nom d'hôte 'localstack'
      - name: 10. Tester le lancement du conteneur
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATABASE_URL: sqlite:///./test.db
          AWS_ENDPOINT_URL: http://localstack:4566
          AWS_S3_BUCKET: edona-item-images-bucket
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
        run: |
          docker run -d -p 8000:8000 --network ci-network --name test-container \
            -e OPENAI_API_KEY=$OPENAI_API_KEY \
            -e DATABASE_URL=$DATABASE_URL \
            -e AWS_ENDPOINT_URL=$AWS_ENDPOINT_URL \
            -e AWS_S3_BUCKET=$AWS_S3_BUCKET \
            -e AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY \
            -e AWS_DEFAULT_REGION=$AWS_DEFAULT_REGION \
            edona-backend:test
          
          sleep 5

          curl --retry 5 --retry-delay 3 --retry-connrefused http://localhost:8000/health || {
            echo "=== LOGS DU CONTENEUR EN CAS D'ÉCHEC ==="
            docker logs test-container
            exit 1
          }